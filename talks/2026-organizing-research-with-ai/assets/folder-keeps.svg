<svg viewBox="0 0 1280 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three sessions come and go; each reads from and writes to the same folder, which stays.">
<defs><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FABD0F"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb0dc"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" transform="translate(0,0)">
<rect x="60" y="40" width="340" height="100" rx="10" fill="#2a2c31" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="9 7"/>
<text x="230" y="86" font-size="26" fill="#e8eaee" text-anchor="middle">Monday's session</text>
<text x="230" y="120" font-size="21" fill="#9aa1ad" text-anchor="middle">ends, and forgets</text>
<line x1="180" y1="146" x2="180" y2="332" stroke="#FABD0F" stroke-width="3" marker-end="url(#a-gold)"/>
<text x="164" y="245" font-size="22" fill="#FABD0F" text-anchor="end">writes</text>
<line x1="280" y1="332" x2="280" y2="146" stroke="#8fb0dc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="296" y="245" font-size="22" fill="#8fb0dc" text-anchor="start">reads</text>
<rect x="460" y="40" width="340" height="100" rx="10" fill="#2a2c31" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="9 7"/>
<text x="630" y="86" font-size="26" fill="#e8eaee" text-anchor="middle">Thursday's session</text>
<text x="630" y="120" font-size="21" fill="#9aa1ad" text-anchor="middle">ends, and forgets</text>
<line x1="580" y1="146" x2="580" y2="332" stroke="#FABD0F" stroke-width="3" marker-end="url(#a-gold)"/>
<text x="564" y="245" font-size="22" fill="#FABD0F" text-anchor="end">writes</text>
<line x1="680" y1="332" x2="680" y2="146" stroke="#8fb0dc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="696" y="245" font-size="22" fill="#8fb0dc" text-anchor="start">reads</text>
<rect x="860" y="40" width="340" height="100" rx="10" fill="#2a2c31" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1030" y="86" font-size="26" fill="#e8eaee" text-anchor="middle">a session on the laptop</text>
<text x="1030" y="120" font-size="21" fill="#9aa1ad" text-anchor="middle">ends, and forgets</text>
<line x1="980" y1="146" x2="980" y2="332" stroke="#FABD0F" stroke-width="3" marker-end="url(#a-gold)"/>
<text x="964" y="245" font-size="22" fill="#FABD0F" text-anchor="end">writes</text>
<line x1="1080" y1="332" x2="1080" y2="146" stroke="#8fb0dc" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="1096" y="245" font-size="22" fill="#8fb0dc" text-anchor="start">reads</text>
<rect x="40" y="340" width="1200" height="130" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="3"/>
<text x="640" y="394" font-size="32" fill="#FABD0F" text-anchor="middle" font-weight="700">the folder</text>
<text x="640" y="440" font-size="25" fill="#e8eaee" text-anchor="middle">notes · decisions · results · wiki.md</text>
<line x1="60" y1="500" x2="1220" y2="500" stroke="#9aa1ad" stroke-width="2" marker-end="url(#a-muted)"/>
<text x="640" y="534" font-size="21" fill="#9aa1ad" text-anchor="middle">time</text>
</g>
</svg>
