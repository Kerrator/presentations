<svg viewBox="0 0 1280 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four steps to start: one root folder, a wiki.md, git init, and a new wiki.md as folders grow.">
<defs><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FABD0F"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb0dc"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" transform="translate(0,0)">
<rect x="20" y="30" width="280" height="270" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="2"/>
<circle cx="160" cy="90" r="34" fill="#FABD0F"/>
<text x="160" y="103" font-size="36" fill="#1b1c1f" text-anchor="middle" font-weight="700">1</text>
<text x="160" y="176" font-size="27" fill="#e8eaee" text-anchor="middle" font-weight="700">One root folder</text>
<text x="160" y="224" font-size="22" fill="#9aa1ad" text-anchor="middle">put your repos</text>
<text x="160" y="258" font-size="22" fill="#9aa1ad" text-anchor="middle">under it</text>
<line x1="304" y1="165" x2="334" y2="165" stroke="#9aa1ad" stroke-width="3" marker-end="url(#a-muted)"/>
<rect x="340" y="30" width="280" height="270" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="2"/>
<circle cx="480" cy="90" r="34" fill="#FABD0F"/>
<text x="480" y="103" font-size="36" fill="#1b1c1f" text-anchor="middle" font-weight="700">2</text>
<text x="480" y="176" font-size="27" fill="#e8eaee" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="700">wiki.md</text>
<text x="480" y="224" font-size="22" fill="#9aa1ad" text-anchor="middle">one line</text>
<text x="480" y="258" font-size="22" fill="#9aa1ad" text-anchor="middle">per repo</text>
<line x1="624" y1="165" x2="654" y2="165" stroke="#9aa1ad" stroke-width="3" marker-end="url(#a-muted)"/>
<rect x="660" y="30" width="280" height="270" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="2"/>
<circle cx="800" cy="90" r="34" fill="#FABD0F"/>
<text x="800" y="103" font-size="36" fill="#1b1c1f" text-anchor="middle" font-weight="700">3</text>
<text x="800" y="176" font-size="27" fill="#e8eaee" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="700">git init</text>
<text x="800" y="224" font-size="22" fill="#9aa1ad" text-anchor="middle">ignore the</text>
<text x="800" y="258" font-size="22" fill="#9aa1ad" text-anchor="middle">nested repos</text>
<line x1="944" y1="165" x2="974" y2="165" stroke="#9aa1ad" stroke-width="3" marker-end="url(#a-muted)"/>
<rect x="980" y="30" width="280" height="270" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="2"/>
<circle cx="1120" cy="90" r="34" fill="#FABD0F"/>
<text x="1120" y="103" font-size="36" fill="#1b1c1f" text-anchor="middle" font-weight="700">4</text>
<text x="1120" y="176" font-size="27" fill="#e8eaee" text-anchor="middle" font-weight="700">Grow it</text>
<text x="1120" y="224" font-size="22" fill="#9aa1ad" text-anchor="middle">a new wiki.md when</text>
<text x="1120" y="258" font-size="22" fill="#9aa1ad" text-anchor="middle">a folder gets big</text>
</g>
</svg>
