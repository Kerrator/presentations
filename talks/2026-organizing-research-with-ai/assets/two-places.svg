<svg viewBox="0 0 1280 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: a browser chat reaches the model, and your files reach the chat only when you copy and paste. Right: an agent on your computer reaches the same model and opens files, runs commands and saves changes in your folder.">
<defs><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FABD0F"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb0dc"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" transform="translate(0,0)">
<rect x="470" y="20" width="340" height="76" rx="10" fill="#2a2c31" stroke="#8fb0dc" stroke-width="2"/>
<text x="640" y="68" font-size="26" fill="#e8eaee" text-anchor="middle">the model, in the cloud</text>
<path d="M 520 96 L 290 180" stroke="#9aa1ad" stroke-width="3" fill="none"/>
<rect x="110" y="180" width="360" height="76" rx="10" fill="#2a2c31" stroke="#9aa1ad" stroke-width="2"/>
<text x="290" y="228" font-size="28" fill="#e8eaee" text-anchor="middle">chat in a browser</text>
<line x1="290" y1="400" x2="290" y2="262" stroke="#9aa1ad" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a-muted)"/>
<text x="312" y="340" font-size="24" fill="#9aa1ad" text-anchor="start">you copy and paste</text>
<rect x="110" y="404" width="360" height="130" rx="10" fill="#2a2c31" stroke="#3a3d44" stroke-width="2"/>
<text x="290" y="452" font-size="26" fill="#9aa1ad" text-anchor="middle">your files</text>
<text x="290" y="494" font-size="21" fill="#9aa1ad" text-anchor="middle">the chat cannot open them</text>
<path d="M 760 96 L 990 180" stroke="#FABD0F" stroke-width="3" fill="none"/>
<rect x="810" y="180" width="360" height="76" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="3"/>
<text x="990" y="228" font-size="28" fill="#FABD0F" text-anchor="middle" font-weight="700">agent on your computer</text>
<line x1="900" y1="262" x2="900" y2="398" stroke="#FABD0F" stroke-width="3" marker-end="url(#a-gold)" marker-start="url(#a-gold)"/>
<text x="924" y="306" font-size="24" fill="#e8eaee" text-anchor="start">opens files</text>
<text x="924" y="338" font-size="24" fill="#e8eaee" text-anchor="start">runs commands</text>
<text x="924" y="370" font-size="24" fill="#e8eaee" text-anchor="start">saves changes</text>
<rect x="730" y="404" width="520" height="130" rx="10" fill="#2a2c31" stroke="#FABD0F" stroke-width="3"/>
<text x="990" y="446" font-size="26" fill="#e8eaee" text-anchor="middle">your folder</text>
<rect x="752" y="468" width="110" height="46" rx="6" fill="#1f2125" stroke="#3a3d44" stroke-width="2"/>
<text x="807" y="499" font-size="21" fill="#9aa1ad" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">papers</text>
<rect x="874" y="468" width="110" height="46" rx="6" fill="#1f2125" stroke="#3a3d44" stroke-width="2"/>
<text x="929" y="499" font-size="21" fill="#9aa1ad" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">code</text>
<rect x="996" y="468" width="110" height="46" rx="6" fill="#1f2125" stroke="#3a3d44" stroke-width="2"/>
<text x="1051" y="499" font-size="21" fill="#9aa1ad" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">data</text>
<rect x="1118" y="468" width="110" height="46" rx="6" fill="#1f2125" stroke="#3a3d44" stroke-width="2"/>
<text x="1173" y="499" font-size="21" fill="#9aa1ad" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">notes</text>
</g>
</svg>
