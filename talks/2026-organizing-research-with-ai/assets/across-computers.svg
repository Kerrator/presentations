<text x="640" y="362" font-size="23" fill="#FABD0F" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">research-home/</text>
<text x="640" y="398" font-size="21" fill="#9aa1ad" text-anchor="middle">same wiki files</text>
<text x="640" y="430" font-size="21" fill="#9aa1ad" text-anchor="middle">same skills, same repos</text>
<path d="M 640 106 L 1060 250" stroke="#FABD0F" stroke-width="3" fill="none" marker-end="url(#a-gold)"/>
<rect x="880" y="256" width="360" height="230" rx="10" fill="#2a2c31" stroke="#8fb0dc" stroke-width="2"/>
