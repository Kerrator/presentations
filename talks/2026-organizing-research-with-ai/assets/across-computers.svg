<svg viewBox="0 0 1280 506" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One home repo on a git server is cloned to a laptop, a Linux box and a labmate's computer; each gets the same folder.">
<defs><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FABD0F"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb0dc"/></marker></defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" transform="translate(0,0)">
