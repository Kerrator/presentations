<text x="220" y="362" font-size="23" fill="#FABD0F" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">research-home/</text>
<text x="220" y="398" font-size="21" fill="#9aa1ad" text-anchor="middle">same wiki files</text>
<text x="220" y="430" font-size="21" fill="#9aa1ad" text-anchor="middle">same skills, same repos</text>
<path d="M 640 106 L 640 250" stroke="#FABD0F" stroke-width="3" fill="none" marker-end="url(#a-gold)"/>
