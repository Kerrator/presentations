<text x="1060" y="398" font-size="21" fill="#9aa1ad" text-anchor="middle">same wiki files</text>
<text x="1060" y="430" font-size="21" fill="#9aa1ad" text-anchor="middle">same skills, same repos</text>
<rect x="432" y="150" width="416" height="52" rx="6" fill="#1b1c1f" stroke="#3a3d44" stroke-width="2"/>
<text x="640" y="184" font-size="22" fill="#e8eaee" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">git clone, then ./bootstrap.sh</text>
